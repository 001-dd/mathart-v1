<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f1730; --cream: #f8f4ec; --blush: #e8b4ae; --muted: #a9adbd; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: "Jost", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 20px; left: 24px; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 28px; z-index: 2; pointer-events: none; }
  #hint { position: fixed; top: 62px; left: 24px; font-size: 13px; color: var(--muted); max-width: 70%; line-height: 1.5; z-index: 2; pointer-events: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 22px 22px; background: rgba(15, 23, 48, 0.85); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid rgba(248, 244, 236, 0.12); z-index: 3; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .pill { border: 1px solid rgba(248, 244, 236, 0.35); background: transparent; color: var(--cream); padding: 8px 18px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; touch-action: manipulation; }
  .pill.active { background: var(--blush); border-color: var(--blush); color: #1f2a44; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 24px; align-items: end; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: var(--blush); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="pat"></canvas>
<canvas id="man" style="display:none"></canvas>
<div id="title">Math Art</div>
<div id="hint"></div>

<div id="ui">
  <div class="tabs">
    <button class="pill active" data-view="pattern">Patterns</button>
    <button class="pill" data-view="mandel">Mandelbrot</button>
  </div>

  <div id="pcontrols" class="controls">
    <div class="row"><label>Speed <span id="spv">1.0</span></label><input id="sp" type="range" min="0.1" max="3" step="0.1" value="1"></div>
    <div class="row"><label>Circle 2 <span id="f2v">3</span></label><input id="f2" type="range" min="-12" max="12" step="1" value="3"></div>
    <div class="row"><label>Circle 3 <span id="f3v">-5</span></label><input id="f3" type="range" min="-12" max="12" step="1" value="-5"></div>
    <div class="row"><label>Trail <span id="trv">3000</span></label><input id="tr" type="range" min="200" max="6000" step="100" value="3000"></div>
    <div class="btnrow">
      <button class="pill" id="rand">Randomize</button>
      <button class="pill" id="pause">Pause</button>
    </div>
  </div>

  <div id="mcontrols" class="controls" hidden>
    <div class="btnrow">
      <button class="pill" id="zout">Zoom out</button>
      <button class="pill" id="zreset">Reset</button>
      <button class="pill" id="zsea">Seahorse valley</button>
    </div>
    <div class="row"><label>Zoom <span id="zv">1x</span></label></div>
  </div>
</div>

<script>
// ---- COLORS: change these to restyle the whole page ----
const THEME = {
  bg: "#0f1730",
  line: "#f8f4ec",
  arm: "rgba(248, 244, 236, 0.30)",
  accent: "#e8b4ae"
};

const pcanvas = document.getElementById("pat");
const pctx = pcanvas.getContext("2d");
const mcanvas = document.getElementById("man");
const mctx = mcanvas.getContext("2d");
const ui = document.getElementById("ui");
const hint = document.getElementById("hint");

let W = 0, H = 0, view = "pattern";

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  pcanvas.style.width = W + "px";
  pcanvas.style.height = H + "px";
  pcanvas.width = Math.floor(W * dpr);
  pcanvas.height = Math.floor(H * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mcanvas.style.width = W + "px";
  mcanvas.style.height = H + "px";
  if (view === "mandel") renderMandel();
}

// ---------- PATTERNS ----------
const R1 = 0.55, R2 = 0.30, R3 = 0.15;
let f2 = 3, f3 = -5, speed = 1, maxTrail = 3000;
let t = 0, paused = false;
let trail = [];

function tip(tt) {
  return [
    R1 * Math.cos(tt) + R2 * Math.cos(f2 * tt) + R3 * Math.cos(f3 * tt),
    R1 * Math.sin(tt) + R2 * Math.sin(f2 * tt) + R3 * Math.sin(f3 * tt)
  ];
}

function drawPattern() {
  if (!paused) {
    for (let i = 0; i < 4; i++) {
      t += 0.004 * speed;
      trail.push(tip(t));
    }
    while (trail.length > maxTrail) trail.shift();
  }

  const uiH = ui.offsetHeight;
  const cx = W / 2;
  const cy = (H - uiH) / 2 + 24;
  const R = Math.min(W, H - uiH - 40) * 0.45;

  pctx.fillStyle = THEME.bg;
  pctx.fillRect(0, 0, W, H);

  if (trail.length > 1) {
    pctx.beginPath();
    pctx.moveTo(cx + R * trail[0][0], cy + R * trail[0][1]);
    for (let i = 1; i < trail.length; i++) {
      pctx.lineTo(cx + R * trail[i][0], cy + R * trail[i][1]);
    }
    pctx.strokeStyle = THEME.line;
    pctx.lineWidth = 1.4;
    pctx.lineJoin = "round";
    pctx.stroke();
  }

  const ax = R1 * Math.cos(t), ay = R1 * Math.sin(t);
  const bx = ax + R2 * Math.cos(f2 * t), by = ay + R2 * Math.sin(f2 * t);
  const px = bx + R3 * Math.cos(f3 * t), py = by + R3 * Math.sin(f3 * t);

  pctx.strokeStyle = THEME.arm;
  pctx.lineWidth = 1;
  pctx.beginPath(); pctx.arc(cx, cy, R * R1, 0, Math.PI * 2); pctx.stroke();
  pctx.beginPath(); pctx.arc(cx + R * ax, cy + R * ay, R * R2, 0, Math.PI * 2); pctx.stroke();
  pctx.beginPath(); pctx.arc(cx + R * bx, cy + R * by, R * R3, 0, Math.PI * 2); pctx.stroke();

  pctx.beginPath();
  pctx.moveTo(cx, cy);
  pctx.lineTo(cx + R * ax, cy + R * ay);
  pctx.lineTo(cx + R * bx, cy + R * by);
  pctx.lineTo(cx + R * px, cy + R * py);
  pctx.stroke();

  pctx.fillStyle = THEME.line;
  [[0, 0], [ax, ay], [bx, by]].forEach(p => {
    pctx.beginPath();
    pctx.arc(cx + R * p[0], cy + R * p[1], 3, 0, Math.PI * 2);
    pctx.fill();
  });
  pctx.fillStyle = THEME.accent;
  pctx.beginPath();
  pctx.arc(cx + R * px, cy + R * py, 5, 0, Math.PI * 2);
  pctx.fill();
}

function frame() {
  if (view === "pattern") drawPattern();
  requestAnimationFrame(frame);
}

function bindSlider(id, labelId, onChange, clear) {
  const el = document.getElementById(id);
  const lab = document.getElementById(labelId);
  el.addEventListener("input", () => {
    const v = parseFloat(el.value);
    lab.textContent = id === "sp" ? v.toFixed(1) : String(v);
    onChange(v);
    if (clear) trail = [];
  });
}
bindSlider("sp", "spv", v => { speed = v; }, false);
bindSlider("f2", "f2v", v => { f2 = v; }, true);
bindSlider("f3", "f3v", v => { f3 = v; }, true);
bindSlider("tr", "trv", v => { maxTrail = v; }, false);

function randFreq() {
  let n = 0;
  while (n === 0) n = Math.floor(Math.random() * 25) - 12;
  return n;
}
document.getElementById("rand").addEventListener("click", () => {
  f2 = randFreq();
  f3 = randFreq();
  document.getElementById("f2").value = f2;
  document.getElementById("f3").value = f3;
  document.getElementById("f2v").textContent = f2;
  document.getElementById("f3v").textContent = f3;
  trail = [];
});
const pauseBtn = document.getElementById("pause");
pauseBtn.addEventListener("click", () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume" : "Pause";
});

// ---------- MANDELBROT ----------
let mcx = -0.5, mcy = 0, span = 3, token = 0;

// colour table: navy -> dusty blue -> blush -> cream -> sand -> navy
const STOPS = [[11, 16, 32], [31, 42, 68], [96, 86, 120], [235, 196, 190], [248, 244, 236], [214, 199, 159], [11, 16, 32]];
const LUT = [];
(function buildLut() {
  const N = 512;
  const segs = STOPS.length - 1;
  for (let i = 0; i < N; i++) {
    const pos = (i / N) * segs;
    const k = Math.floor(pos);
    const f = pos - k;
    const a = STOPS[k], b = STOPS[k + 1];
    LUT.push([
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ]);
  }
})();

function updateZoomLabel() {
  const z = 3 / span;
  document.getElementById("zv").textContent =
    (z < 1000 ? Math.round(z) : z.toExponential(1)) + "x";
}

function renderMandel() {
  const w = Math.max(200, Math.floor(W / 2));
  const h = Math.max(150, Math.floor(H / 2));
  mcanvas.width = w;
  mcanvas.height = h;
  const img = mctx.createImageData(w, h);
  const data = img.data;
  const aspect = w / h;
  const maxIter = Math.min(900, 120 + Math.max(0, Math.round(60 * Math.log2(3 / span))));
  const my = ++token;
  let row = 0;
  updateZoomLabel();
  hint.textContent = "Rendering...";

  function chunk() {
    if (my !== token) return;
    const t0 = performance.now();
    const start = row;
    while (row < h && performance.now() - t0 < 14) {
      const im = mcy + (row / h - 0.5) * span;
      for (let x = 0; x < w; x++) {
        const re = mcx + (x / w - 0.5) * span * aspect;
        let zr = 0, zi = 0, zr2 = 0, zi2 = 0, i = 0;
        while (i < maxIter && zr2 + zi2 <= 65536) {
          zi = 2 * zr * zi + im;
          zr = zr2 - zi2 + re;
          zr2 = zr * zr;
          zi2 = zi * zi;
          i++;
        }
        const idx = (row * w + x) * 4;
        if (i >= maxIter) {
          data[idx] = 11; data[idx + 1] = 16; data[idx + 2] = 32;
        } else {
          const logzn = Math.log(zr2 + zi2) / 2;
          const nu = Math.log(logzn / Math.LN2) / Math.LN2;
          const mu = i + 1 - nu;
          let k = ((mu * 5) | 0) % LUT.length;
          if (k < 0) k += LUT.length;
          const c = LUT[k];
          data[idx] = c[0]; data[idx + 1] = c[1]; data[idx + 2] = c[2];
        }
        data[idx + 3] = 255;
      }
      row++;
    }
    mctx.putImageData(img, 0, 0, 0, start, w, row - start);
    if (row < h) requestAnimationFrame(chunk);
    else hint.textContent = "Tap anywhere to zoom in. Each tap zooms 2.5 times closer.";
  }
  chunk();
}

mcanvas.addEventListener("click", e => {
  const rect = mcanvas.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width;
  const fy = (e.clientY - rect.top) / rect.height;
  const aspect = mcanvas.width / mcanvas.height;
  mcx += (fx - 0.5) * span * aspect;
  mcy += (fy - 0.5) * span;
  span = Math.max(span / 2.5, 1e-11);
  renderMandel();
});
document.getElementById("zout").addEventListener("click", () => {
  span = Math.min(3, span * 2.5);
  renderMandel();
});
document.getElementById("zreset").addEventListener("click", () => {
  mcx = -0.5; mcy = 0; span = 3;
  renderMandel();
});
document.getElementById("zsea").addEventListener("click", () => {
  mcx = -0.7436439; mcy = 0.1318259; span = 0.02;
  renderMandel();
});

// ---------- TABS ----------
function setView(v) {
  view = v;
  document.querySelectorAll(".pill[data-view]").forEach(b =>
    b.classList.toggle("active", b.dataset.view === v));
  document.getElementById("pcontrols").hidden = v !== "pattern";
  document.getElementById("mcontrols").hidden = v !== "mandel";
  pcanvas.style.display = v === "pattern" ? "block" : "none";
  mcanvas.style.display = v === "mandel" ? "block" : "none";
  if (v === "pattern") {
    hint.textContent = "Every circle spins. With whole-number speeds the curve closes into a pattern.";
  } else {
    renderMandel();
  }
}
document.querySelectorAll(".pill[data-view]").forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.view)));

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
});

resize();
setView("pattern");
requestAnimationFrame(frame);
</script>
</body>
</html>
